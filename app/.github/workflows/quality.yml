name: BUILD quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check browser scripts
        run: |
          node --check data.js
          node --check workflow-client.js
          node --check dev-server.cjs
          node --check calendar.js
          node --check app.js
          node --check migration-client.js
          node --check engine-v2.js
          node --check profile-client.js
          node --check plan-import-client.js
          node --check insights-client.js
          node --check analysis-client.js
          node --check strava-client.js
          node --check sw.js
      - name: Check serverless functions
        run: |
          node --check api/health.js
          node --check lib/strava.cjs
          node --check scripts/build.cjs
          node --check api/strava/connect.js
          node --check api/strava/callback.js
          node --check api/strava/activities.js
          node --check api/strava/disconnect.js
      - name: Check training calculations and offline boundaries
        run: npm test
      - name: Build the static deployment files
        run: npm run build
